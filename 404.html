<script>
  // Pages moved into folders in Nov 2026. Static hosts without redirect rules (e.g. GitHub Pages)
  // land here; send old links to their new home instead of showing a dead end.
  (function () {
    var moved = {
      'grammar_studio.html': 'pages/grammar_studio.html',
      'splash_help.html': 'pages/splash_help.html',
      'splash_settings.html': 'pages/splash_settings.html',
      'architect-portal-2026.html': 'pages/architect-portal-2026.html',
      'architect-review-2026.html': 'pages/architect-review-2026.html',
      'mealy_moore_studio.html': 'index.html#mm',
      'pda_studio.html': 'index.html#pda',
      'tm_studio.html': 'index.html#tm'
    };
    var path = location.pathname, name = path.split('/').pop();
    var base = path.slice(0, path.length - name.length);
    if (moved[name]) location.replace(base + moved[name] + (moved[name].indexOf('#') < 0 ? location.search + location.hash : ''));
  })();
</script>
