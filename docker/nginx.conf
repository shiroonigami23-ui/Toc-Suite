server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  types { text/javascript mjs; application/manifest+json webmanifest; }
  location / { try_files $uri $uri/ =404; }
  error_page 404 /404.html;
  # assignment features live on the hosted site
  location /.netlify/functions/ { return 302 https://toc-suite.netlify.app$request_uri; }
}
